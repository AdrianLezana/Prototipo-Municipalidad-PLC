<!DOCTYPE html>
<html lang="es">
<head>

  <title>Acceso — Sistema Interno</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; background: var(--bg-secondary); }

  </style>
</head>
<body>

<div class="login-box card">

  <a href="bandeja.html" class="btn btn-primary w-full" style="justify-content:center;">Ingresar</a>

  <div class="text-center mt-md">
