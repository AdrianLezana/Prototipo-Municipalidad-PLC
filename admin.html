<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-layout">
  <aside class="sidebar">
    <div style="padding: 0 var(--sp-lg) var(--sp-xl);">
      <div style="font-weight:700;">Padre Las Casas</div>
      <div style="font-size:11px; color:var(--text-muted);">Sistema Interno</div>
    </div>
    <ul style="list-style:none;">
      <li><a href="bandeja.html" style="display:block; padding:10px var(--sp-lg); color:var(--text-secondary); text-decoration:none;">📥 Solicitudes de Residencia</a></li>
      <li><a href="admin.html" style="display:block; padding:10px var(--sp-lg); color:var(--accent-cyan); background:rgba(255,255,255,0.05);">⚙️ Administración</a></li>

            <td>Admin Sistemas</td>

          </tr>
          <tr>
