<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitud de Certificado de Residencia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="navbar-brand">
    <div class="brand-icon">🏛️</div>
    <div class="brand-text">
      <span class="brand-name">Padre Las Casas</span>
      <span class="brand-sub">Trámites en Línea</span>
    </div>
  </a>
  <ul class="navbar-nav">
    <li><a href="index.html" class="nav-link">Inicio</a></li>
    <li><a href="solicitud.html" class="nav-link active">Solicitar Certificado</a></li>
    <li><a href="consulta.html" class="nav-link">Consultar Estado</a></li>
  </ul>
</nav>

<main class="section">
  <div class="section-header">
    <h1 class="section-title">Solicitud de Certificado de Residencia</h1>
    <p style="color: var(--text-secondary);">Complete sus datos para emitir el certificado.</p>
  </div>

  <div class="card" style="max-width: 800px; margin: 0 auto;">
    <form onsubmit="event.preventDefault(); window.location.href='consulta.html';">

      <div style="margin-bottom: var(--sp-2xl);">
        <label class="form-label" style="display:block; margin-bottom:var(--sp-md);">1. Datos del Solicitante</label>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Nombre Completo <span class="req">*</span></label>
            <input type="text" class="form-control" placeholder="Ej: Juan Pérez González" required>
          </div>
          <div class="form-group">
            <label class="form-label">RUT <span class="req">*</span></label>
            <input type="text" class="form-control" placeholder="12.345.678-9" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Correo Electrónico <span class="req">*</span></label>
            <input type="email" class="form-control" placeholder="correo@ejemplo.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Teléfono / Celular <span class="req">*</span></label>
            <input type="tel" class="form-control" placeholder="+56 9 1234 5678" required>
          </div>
        </div>
      </div>

      <div style="margin-bottom: var(--sp-2xl);">
        <label class="form-label" style="display:block; margin-bottom:var(--sp-md);">2. Dirección de Residencia</label>
        <div class="form-group">
          <label class="form-label">Dirección Completa <span class="req">*</span></label>
          <input type="text" class="form-control" placeholder="Calle, número, villa/población" required>
        </div>
        <div class="form-group">
          <label class="form-label">Sector <span class="req">*</span></label>
          <select class="form-control" required>
            <option value="" disabled selected>Seleccione un sector...</option>
            <option value="urbano">Sector Urbano</option>
            <option value="rural">Sector Rural</option>
          </select>
        </div>
      </div>

      <div class="divider"></div>

      <div style="display: flex; justify-content: flex-end; gap: var(--sp-md);">
        <a href="index.html" class="btn btn-ghost">Cancelar</a>
        <button type="submit" class="btn btn-primary">Enviar Solicitud</button>
      </div>

    </form>
  </div>
</main>
</body>
</html>
